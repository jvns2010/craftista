name: CI Pipeline

on:
  push:
    branches:
      - "**"    # Trigger on all branches
  pull_request:
    branches:
      - main    # Trigger integration tests for PRs to main

jobs:
  individual-service-test:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    name: Test Modified Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Detect Changed Service
        id: detect-changes
        run: |
          # Check which directory was modified
          SERVICE=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | awk -F/ '{print $1}' | sort | uniq)
          echo "service=$SERVICE" >> $GITHUB_ENV

      - name: Build and Test Modified Service
        run: |
          case $SERVICE in
            catalogue)
              docker build -t craftista-catalogue:dev -f ./catalogue/Dockerfile ./catalogue
              docker run --rm craftista-catalogue:dev pytest
              ;;
            recommendation)
              docker build -t craftista-recco:dev -f ./recommendation/Dockerfile ./recommendation
              docker run --rm craftista-recco:dev go test ./...
              ;;
            voting)
              docker build -t craftista-voting:dev -f ./voting/Dockerfile ./voting
              docker run --rm craftista-voting:dev java -jar app.jar --test
              ;;
            frontend)
              docker build -t craftista-frontend:dev -f ./frontend/Dockerfile ./frontend
              docker run --rm craftista-frontend:dev npm test
              ;;
            *)
              echo "No relevant service changes detected."
              ;;
          esac

  integration-test:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    name: Integration Test All Services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Compose
        run: docker compose version

      - name: Build and Start Services
        run: docker compose up --build -d

      - name: Run Integration Tests
        run: |
          docker exec catalogue pytest
          docker exec recommendation go test ./...
          docker exec voting java -jar app.jar --test
          docker exec frontend npm test

      - name: Tear Down Services
        run: docker compose down
